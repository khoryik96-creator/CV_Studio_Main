version: 2

# Dependabot proposes updates as pull requests. It does not install packages on
# local CV Studio machines; INSTALL.bat remains the dependency installer.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(python)"
    groups:
      python-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# Do not add npm version updates casually. adm-zip is pinned to 0.6.0 and its
# unpacked files are verified by an owner-controlled aggregate hash. Upgrading
# it requires a deliberate source review, vetted-tree replacement and hash bump.
