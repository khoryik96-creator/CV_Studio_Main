name: Build protected CV Studio packages

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-protected.yml"
      - "owner_build_tools/**"
      - "requirements.txt"
      - "package.json"
      - "CV Studio.bat"
      - "INSTALL*.bat"
      - "INSTALL*.ps1"
      - "START_HIDDEN.vbs"
      - "WATCHDOG.vbs"
      - "STOP*.bat"
      - "STOP*.ps1"
      - "FORCE_STOP*.bat"
      - "FORCE_STOP*.ps1"
      - "UPDATE*.bat"
      - "UPDATE*.ps1"
      - "INSTANCE_PORT.ps1"
      - "RESTORE_PREVIOUS.*"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which platforms to build (Windows-only is far cheaper on Actions minutes)"
        type: choice
        default: windows-x64
        options:
          - windows-x64
          - all
          - macos-only

permissions:
  contents: read

concurrency:
  group: cv-studio-protected-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap 1x ubuntu runner: pick the build matrix from the chosen target so
  # only the requested (paid) runners are ever allocated. A Windows-only build
  # skips the two macOS runners, which bill at 10x minutes each.
  select-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Resolve build matrix
        id: pick
        shell: bash
        run: |
          win='{"target":"windows-x64","os":"windows-latest","python":"3.12"}'
          mac_intel='{"target":"macos-intel","os":"macos-15-intel","python":"3.12"}'
          mac_arm='{"target":"macos-arm64","os":"macos-15","python":"3.12"}'
          case "${{ inputs.targets }}" in
            all)        matrix="{\"include\":[$win,$mac_intel,$mac_arm]}" ;;
            macos-only) matrix="{\"include\":[$mac_intel,$mac_arm]}" ;;
            *)          matrix="{\"include\":[$win]}" ;;
          esac
          echo "Selected targets: ${{ inputs.targets }}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: select-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # The single-worker, low-memory Windows compile can exceed 90 minutes.
    # Keep a bounded margin around the builder's 120-minute compile timeout for
    # dependency setup, smoke testing, cleanup, and artifact uploads.
    timeout-minutes: 150

    steps:
      - name: Disable Git line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package version
        id: package-version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Normalize private repository dependency state
        shell: bash
        run: |
          python owner_build_tools/repo_consistency.py --root . --repair --report repo_consistency_report.json
          if ! git diff --quiet -- package-lock.json npm-shrinkwrap.json package.json .gitignore .gitattributes "*.bat" owner_build_tools/*.bat owner_build_tools/*.command .github/workflows/build-protected.yml; then
            echo "::warning::The checkout contained stale npm lock/workflow state. The build normalized it. Commit the current owner-kit files to keep the private repository clean."
            git diff -- package-lock.json npm-shrinkwrap.json package.json .gitignore .gitattributes "*.bat" owner_build_tools/*.bat owner_build_tools/*.command .github/workflows/build-protected.yml || true
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Python build and runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka==4.1.3" ordered-set zstandard
          python -m pip install -r requirements.txt
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then python -m pip install pywin32; fi

      - name: Install mandatory native Tesseract on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          command -v tesseract >/dev/null 2>&1 || brew install tesseract
          tesseract --version
          tesseract --list-langs | grep -Fx eng

      - name: Install mandatory native Tesseract on Windows
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          if (-not (Get-Command tesseract.exe -ErrorAction SilentlyContinue)) {
            $installed = $false
            foreach ($attempt in 1..3) {
              choco install tesseract --version=5.5.0.20241111 --yes --no-progress
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $installed) { throw 'Pinned Tesseract installation failed after three attempts.' }
          }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath"
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          & $tesseract.Source --version
          $languages = @(& $tesseract.Source --list-langs)
          if ($LASTEXITCODE -ne 0 -or -not ($languages -contains 'eng')) {
            throw 'Mandatory Tesseract English language data is unavailable.'
          }

      - name: Install Node runtime and protection dependencies
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false javascript-obfuscator@4.1.1

      - name: Verify dependency/workflow consistency after npm install
        shell: bash
        run: |
          python owner_build_tools/repo_consistency.py --root . --report repo_consistency_report.json

      - name: Build and smoke-test protected package
        shell: bash
        run: |
          python owner_build_tools/build_protected.py \
            --target "${{ matrix.target }}" \
            --source-root . \
            --output-dir protected-output

      - name: Verify smoke result
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path('protected-output').glob('*protected_smoke.json'))
          if len(files)!=1:
              raise SystemExit(f'Expected one smoke result, found {len(files)}')
          data=json.loads(files[0].read_text(encoding='utf-8'))
          if data.get('ok') is not True:
              raise SystemExit(f'Protected smoke failed: {data}')
          print('Protected smoke passed:', files[0])
          PY

      - name: Upload colleague package and public smoke result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-studio-v${{ steps.package-version.outputs.value }}-${{ matrix.target }}-COLLEAGUE
          path: |
            protected-output/*colleague.zip
            protected-output/*protected_smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload owner-only compiler diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-studio-v${{ steps.package-version.outputs.value }}-${{ matrix.target }}-OWNER-DIAGNOSTICS
          path: |
            protected-output/*nuitka_report.xml
            protected-output/*runtime.log
            protected-output/*failure.json
            protected-output/*startup_timing_failure.log
            repo_consistency_report.json
          if-no-files-found: ignore
          retention-days: 7
