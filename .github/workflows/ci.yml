name: CV Studio regression

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-studio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows x64 regression
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Disable Git line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywin32 pytest

      - name: Install mandatory Tesseract
        shell: pwsh
        run: |
          if (-not (Get-Command tesseract.exe -ErrorAction SilentlyContinue)) {
            $installed = $false
            foreach ($attempt in 1..3) {
              choco install tesseract --version=5.5.0.20241111 --yes --no-progress
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $installed) { throw 'Pinned Tesseract installation failed after three attempts.' }
          }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath"
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          & $tesseract.Source --version
          $languages = @(& $tesseract.Source --list-langs)
          if ($LASTEXITCODE -ne 0 -or -not ($languages -contains 'eng')) {
            throw 'Mandatory Tesseract English language data is unavailable.'
          }

      - name: Install Node dependencies
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run complete Python regression suite
        shell: bash
        run: python -m pytest tests -q

      - name: Run all frontend fixtures
        shell: bash
        run: |
          for fixture in tests/test_*.js; do
            node "$fixture"
          done

      - name: Run live source smoke
        shell: bash
        run: python tests/run_phase2a_source_smoke.py

      - name: Validate tracked Python syntax
        shell: pwsh
        run: |
          $files = @(git ls-files '*.py')
          python -m py_compile @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate tracked JavaScript syntax
        shell: pwsh
        run: |
          foreach ($file in @(git ls-files '*.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate tracked PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Validate tracked POSIX shell syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh' '*.command')

      - name: Verify repository consistency
        shell: bash
        run: |
          python owner_build_tools/repo_consistency.py --root .
          git diff --check

  macos-native-dependencies:
    name: ${{ matrix.name }} dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            target: macos-intel
          - name: macOS Apple Silicon
            os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Disable Git line-ending conversion
        run: git config --global core.autocrlf false
      - name: Check out private source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python and mandatory Tesseract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          command -v tesseract >/dev/null 2>&1 || brew install tesseract
      - name: Verify native Antiword and Tesseract
        run: |
          chmod +x vendor/antiword/${{ matrix.target }}/bin/antiword
          python -m unittest tests.test_antiword_mandatory_dependency tests.test_tesseract_mandatory_dependency
          python - <<'PY'
          from pathlib import Path
          from owner_build_tools.build_protected import validate_antiword_runtime, validate_tesseract_runtime
          root=Path('.').resolve()
          print(validate_antiword_runtime(root, '${{ matrix.target }}'))
          print(validate_tesseract_runtime(root))
          PY
